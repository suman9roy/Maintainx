server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the api-gateway container, stripping the /api prefix
    # (mirrors the Vite dev-server proxy's rewrite in vite.config.js)
    location /api/ {
        proxy_pass http://api-gateway:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the app; fall back to index.html for client-side routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the runtime config — it can change per-deploy without a rebuild
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
