version: "3.9"

secrets:
  github_token:
    file: ./secrets/github_token.txt

networks:
  maintainx-net:
    driver: bridge

volumes:
  postgres-data:

services:

  postgres:
    build: ./postgres
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [maintainx-net]

  # kafka service removed from compose; start/manage Kafka manually from the command line

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    environment:
      EUREKA_PREFER_IP_ADDRESS: "true"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [maintainx-net]

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
      secrets:
        - github_token
    container_name: config-server
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      CONFIG_NATIVE_LOCATION: file:///config-repo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    networks: [maintainx-net]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    env_file:
      - ./env/api-gateway.env
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "9090:9090"
    networks: [maintainx-net]

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    env_file:
      - ./env/auth-service.env
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks: [maintainx-net]

  resident-service:
    build:
      context: .
      dockerfile: resident-service/Dockerfile
    container_name: resident-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    env_file:
      - ./env/resident-service.env
    volumes:
      - ./uploads:/uploads
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks: [maintainx-net]

  maintenance-service:
    build:
      context: .
      dockerfile: maintenance-service/Dockerfile
    container_name: maintenance-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    env_file:
      - ./env/maintenance-service.env
    volumes:
      - ./uploads:/uploads
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks: [maintainx-net]

  expense-service:
    build:
      context: .
      dockerfile: expense-service/Dockerfile
    container_name: expense-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    env_file:
      - ./env/expense-service.env
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks: [maintainx-net]

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    env_file:
      - ./env/payment-service.env
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks: [maintainx-net]

  complaint-service:
    build:
      context: .
      dockerfile: complaint-service/Dockerfile
    container_name: complaint-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    env_file:
      - ./env/complaint-service.env
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks: [maintainx-net]

  notice-service:
    build:
      context: .
      dockerfile: notice-service/Dockerfile
    container_name: notice-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    env_file:
      - ./env/notice-service.env
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks: [maintainx-net]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    env_file:
      - ./env/notification-service.env
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    networks: [maintainx-net]

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - ./env/frontend.env
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "80:80"
    networks: [maintainx-net]